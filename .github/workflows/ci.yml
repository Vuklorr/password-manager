name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Java and client tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test backend (H2)
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Test cryptography and extension guards
        run: node --test tests/*.test.js

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vault_test
          POSTGRES_USER: vault_test
          # Disposable CI database, never a deployment credential.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault_test -d vault_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend against PostgreSQL
        run: >-
          mvn --batch-mode --no-transfer-progress test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/vault_test
          -Dspring.datasource.username=vault_test
          -Dspring.datasource.password=ci-only-password
